[project]
name = "somi"
version = "0.1.0"
description = "Voice-first AI companion"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.0",
    "openai>=1.0",
    "httpx>=0.27",
    "pyaudio>=0.2",
    "sounddevice>=0.5",
    "pvporcupine>=3.0",
    "numpy>=1.26",
    "torch>=2.3",
    "transformers>=4.45",
    "accelerate>=0.30",
]

[project.scripts]
somi = "somi.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
